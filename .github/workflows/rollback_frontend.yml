# Roll the frontend back to a known-good version.
#
# The case for shipping a large interface change at all rests on being able to
# undo it cheaply. That was a claim, not a mechanism: backing out meant hand
# editing frontend-version.txt under pressure, which is exactly the situation
# where a hand edit goes wrong. v2.1.4 backed the redesign out with a
# whole-tree revert that took an unrelated fix with it.
#
# This opens a pull request pinning frontend-version.txt to the version you
# name. It deliberately does NOT release: a human merges the PR and cuts a
# patch release, so the change is reviewed and the rollback appears in the
# history like any other change. The point is to remove the fiddly part, not
# the judgement.
name: Roll back the frontend

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Frontend version to pin, e.g. 1.11.2. Must exist on PyPI."
        required: true
        type: string
      reason:
        description: "Why. Goes in the PR body, and belongs in the release note."
        required: true
        type: string

jobs:
  rollback:
    name: "Pin the frontend to ${{ inputs.version }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Refuse a version that cannot be installed. Pinning a version that does
      # not exist turns a rollback into a broken release — the worst possible
      # outcome for a change made in a hurry.
      - name: Check the version exists on PyPI
        run: |
          set -euo pipefail
          python .github/scripts/vendor_frontend.py \
            --version "${{ inputs.version }}" --resolve-only

      - name: Pin frontend-version.txt
        run: |
          set -euo pipefail
          CURRENT=$(sed -n 's/^[[:space:]]*\([^#[:space:]][^#]*\).*/\1/p' \
            frontend-version.txt | head -1 | tr -d '[:space:]')
          echo "current=${CURRENT:-unset}  ->  ${{ inputs.version }}"
          if [ "${CURRENT}" = "${{ inputs.version }}" ]; then
            echo "::error::frontend-version.txt already says ${{ inputs.version }} — nothing to roll back."
            exit 1
          fi
          {
            printf '# Rolled back on %s.\n' "$(date -u +%Y-%m-%d)"
            printf '# Reason: %s\n' "${{ inputs.reason }}"
            printf '# Previous value: %s\n' "${CURRENT:-unset}"
            printf '%s\n' "${{ inputs.version }}"
          } > frontend-version.txt
          cat frontend-version.txt

      - name: Open the pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "rollback/frontend-${{ inputs.version }}"
          base: lex-app-v2
          commit-message: |
            fix(frontend): roll back to ${{ inputs.version }}

            ${{ inputs.reason }}
          title: "fix(frontend): roll back to ${{ inputs.version }}"
          add-paths: frontend-version.txt
          body: |
            Pins the frontend to `${{ inputs.version }}`.

            **Reason:** ${{ inputs.reason }}

            ## What happens next

            1. Review and merge this.
            2. Cut a patch release as normal. The release pipeline installs
               `lex-app-frontend==${{ inputs.version }}` and ships it.

            ## What this does not do

            It does not release, and it does not write the release note. Both
            are deliberate.

            **The release note must say the frontend was rolled back and why.**
            `v2.1.3` shipped the redesign and `v2.1.4` pulled it back out with
            no note at either end — customers were told about a feature and
            then silently lost it. The reason above is the text to use.
